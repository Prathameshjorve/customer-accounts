[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-tests=1

[coverage:run]
branch=True
source=service

[coverage:report]
omit =
    */tests/*
    */venv/*
    */.venv/*
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    venv,
    .venv

[pylint]
disable =
    C0114,
    C0115,
    C0116,
    R0903
max-line-length = 100
